<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destino</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .18  0 0 0 0 .06  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
--wax:#7d1418;--ink:#1c0f08;--serif:'IM Fell English',Georgia,serif;--black:'UnifrakturCook','IM Fell English',serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{font-family:var(--serif);color:var(--ink);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(190,110,40,.22),transparent 38%),radial-gradient(ellipse at 50% 50%,#1a0d0f,#070405 75%)}
.stage{position:absolute;inset:0;perspective:1400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.hint{margin:0;color:#b9a27a;font-size:22px;font-style:italic;transition:opacity .5s}
.hint.hide{opacity:0}
.env{position:relative;width:min(88vw,350px);height:min(52vw,208px);cursor:pointer;perspective:1000px;-webkit-backface-visibility:hidden;backface-visibility:hidden;filter:drop-shadow(0 18px 22px rgba(0,0,0,.8));transition:transform 1.5s cubic-bezier(.5,0,.9,.6),opacity 1.5s}
.env.gone{transform:translateY(110vh) rotate(7deg);opacity:0;pointer-events:none}
.env:focus-visible{outline:3px solid #e8d3a8;outline-offset:8px}
.kraft{background:radial-gradient(ellipse at 15% 20%,rgba(90,55,20,.35),transparent 40%),radial-gradient(ellipse at 90% 85%,rgba(80,45,15,.4),transparent 45%),var(--tex),linear-gradient(160deg,#c6a46d,#a98652)}
.back,.pocket,.flapw,.sheet{position:absolute}
.back{inset:0;clip-path:polygon(.5% 1%,6% .4%,14% 1.2%,23% .3%,34% 1%,47% .2%,58% 1%,70% .4%,82% 1.1%,92% .3%,99.6% 1%,100% 12%,99.3% 27%,100% 44%,99.5% 60%,100% 78%,99.4% 92%,100% 99.5%,90% 99%,78% 100%,66% 99.2%,53% 100%,40% 99%,27% 100%,15% 99.3%,5% 100%,.4% 99%,0 85%,.7% 70%,.1% 52%,.8% 36%,0 20%);filter:brightness(.62)}
.sheet{z-index:2;left:13%;right:13%;top:5%;bottom:8%;background:repeating-linear-gradient(transparent 0 15px,rgba(60,30,8,.3) 15px 16px),var(--tex),linear-gradient(#cdb27c,#b99b64);transition:transform 1.9s 2.4s cubic-bezier(.35,.1,.25,1),opacity .3s;box-shadow:inset 0 0 18px rgba(70,35,8,.6)}
.pocket{inset:0;z-index:4;clip-path:polygon(0 .5%,50% 58%,100% .5%,99.5% 30%,100% 60%,99.4% 92%,100% 99.5%,80% 99%,55% 100%,30% 99.2%,8% 100%,.4% 90%,0 60%,.6% 30%);filter:brightness(.93)}
.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(60,30,8,.35) 50%,transparent 50.6%) 0 0/50% 100% no-repeat,linear-gradient(to top left,transparent 49.6%,rgba(60,30,8,.35) 50%,transparent 50.6%) 100% 0/50% 100% no-repeat}
.flapw{left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform 1.5s .6s cubic-bezier(.45,.05,.3,1),z-index 0s 1.35s;z-index:3;filter:drop-shadow(0 3px 3px rgba(40,20,5,.55))}
.flap{position:absolute;inset:0;clip-path:polygon(0 .8%,9% 0,22% 1.2%,38% 0,52% 1%,68% 0,83% 1.1%,100% 0,50% 100%);filter:brightness(1.07)}
.env.open .flapw{transform:rotateX(140deg);z-index:1}
.env.open .sheet{transform:translateY(-66%)}
.seal{position:absolute;left:50%;top:58%;width:76px;height:80px;margin:-40px 0 0 -38px;z-index:5}
.half{position:absolute;inset:0;transition:transform 1.3s ease-in,opacity 1.3s ease-in;filter:drop-shadow(0 3px 4px rgba(0,0,0,.65))}
.half img{width:100%;height:100%;display:block}
.half.l{clip-path:inset(0 50% 0 0)}.half.r{clip-path:inset(0 0 0 50%)}
.env.open .l{transform:translate(-22px,70px) rotate(-35deg);opacity:0}
.env.open .r{transform:translate(22px,80px) rotate(40deg);opacity:0}
.envflip{position:relative;width:min(88vw,350px);height:min(52vw,208px);transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.1,.2,1)}
.envflip.flipped{transform:rotateY(180deg)}
.envback{position:absolute;inset:0;transform:rotateY(180deg);-webkit-backface-visibility:hidden;backface-visibility:hidden;filter:drop-shadow(0 18px 22px rgba(0,0,0,.8))}
.envface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;clip-path:polygon(.5% 1%,6% .4%,14% 1.2%,23% .3%,34% 1%,47% .2%,58% 1%,70% .4%,82% 1.1%,92% .3%,99.6% 1%,100% 12%,99.3% 27%,100% 44%,99.5% 60%,100% 78%,99.4% 92%,100% 99.5%,90% 99%,78% 100%,66% 99.2%,53% 100%,40% 99%,27% 100%,15% 99.3%,5% 100%,.4% 99%,0 85%,.7% 70%,.1% 52%,.8% 36%,0 20%)}
.envface .bt{font-size:17px}.envface .bn{font-size:46px}.envface .bk{font-size:18px}
.stamp{position:absolute;top:12px;right:16px;width:34px;height:42px;border:2px dotted rgba(60,25,8,.7);display:grid;place-items:center;color:var(--wax);font-size:20px;transform:rotate(3deg)}
#envflipb{margin-top:-6px;transition:opacity .5s}
.reading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;visibility:hidden;pointer-events:none}
.reading.show{visibility:visible;pointer-events:auto}
.bt{font-size:22px;font-style:italic;margin:0;color:var(--ink)}
.bn{font-family:var(--black);font-weight:700;font-size:54px;line-height:1;margin:0;color:#2a0b0b}
.bk{color:var(--wax);font-size:24px}
.book{position:relative;width:min(92vw,470px);height:min(72vh,640px);perspective:1500px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.85))}
.leaf{position:absolute;inset:0;transform-style:preserve-3d;transform:translateX(var(--x,0)) translateY(var(--y,0)) rotate(var(--r,0deg)) rotateY(var(--ry,0deg));transition:transform 1.1s cubic-bezier(.4,.1,.2,1)}
.leaf.turned{--ry:180deg}
.leaf.past{--x:-135%;--y:-6%;--r:-10deg}
.book.instant .leaf,.book.instant .face{transition:none!important}
.face{position:absolute;inset:0;box-sizing:border-box;overflow:auto;padding:36px 30px 48px;font-size:20px;line-height:1.45;color:var(--ink);-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:opacity .6s .35s;
background:radial-gradient(ellipse at 10% 8%,rgba(70,35,8,.45),transparent 40%),radial-gradient(ellipse at 92% 94%,rgba(60,28,5,.55),transparent 45%),var(--tex),linear-gradient(165deg,#cfb27a,#a88652);
box-shadow:inset 0 0 70px rgba(50,22,3,.85);
clip-path:polygon(0 1%,8% 0,20% .8%,35% 0,52% .7%,68% 0,84% .9%,100% 0,99.4% 25%,100% 52%,99.5% 78%,100% 100%,82% 99.3%,60% 100%,38% 99.2%,16% 100%,0 99.4%,.6% 74%,0 48%,.5% 22%)}
.face.bk{transform:rotateY(180deg);background:radial-gradient(ellipse at 88% 10%,rgba(70,35,8,.45),transparent 40%),radial-gradient(ellipse at 8% 92%,rgba(60,28,5,.55),transparent 45%),var(--tex),linear-gradient(195deg,#cbad74,#a58250)}
.leaf.future .face{opacity:0}
.leaf.past .face{opacity:0;transition:opacity .4s .8s}
.face h1{font-family:var(--black);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 .4em;text-align:center;color:#2a0b0b}
.face .orn{text-align:center;color:var(--wax);font-size:22px;margin:-.2em 0 .8em}
.face p{margin:0 0 .55em;hyphens:auto;-webkit-hyphens:auto}
.face p.sec{margin-top:1.1em}
.face.intropage p{margin:0 0 .45em}
.face.measure{position:absolute;left:0;top:0;bottom:auto;height:auto;visibility:hidden;clip-path:none;overflow:visible;transition:none;pointer-events:none}
.face .first::first-letter{font-family:var(--black);font-size:2.7em;float:left;line-height:.85;padding:.06em .1em 0 0;color:var(--wax)}
.face .sig{text-align:right;font-style:italic;color:#2a0b0b;margin-top:1.4em}
.face .sig .nm{display:block;font-family:'Herr Von Muellerhoff','Mrs Saint Delafield','Snell Roundhand','Apple Chancery','Brush Script MT',cursive;font-style:normal;font-size:3.4em;line-height:1;color:#1c0f08;text-shadow:0 0 1px rgba(28,15,8,.55);transform:rotate(-5deg);transform-origin:right center;margin:.05em .1em 0 0}
.face .sig .nm::after{content:"";display:block;height:12px;width:80%;margin:-.2em 0 0 auto;opacity:.85;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 10 C 40 2, 90 13, 130 6 S 185 3, 198 8' fill='none' stroke='%231c0f08' stroke-width='1.6' stroke-linecap='round'/></svg>") no-repeat right/100% 100%}
.pn{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--black);font-size:20px;color:var(--wax)}
.blank{position:absolute;inset:0;display:grid;place-items:center;color:var(--wax);font-size:44px;opacity:.55}
.face.note{display:flex;flex-direction:column;justify-content:center;padding:36px 36px 48px}
.face.note p{color:#4a1d72;font-style:italic;text-align:center;line-height:1.5;margin:0 0 .8em}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
button:disabled{opacity:.35;cursor:default}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;opacity:0;transition:opacity .6s .9s}
.reading.show .bar{opacity:1}
button{font:inherit;font-size:19px;color:#e8d3a8;background:#3a0d10;border:1px solid #7d1418;border-radius:3px;padding:6px 18px;cursor:pointer}
button:focus-visible{outline:3px solid #e8d3a8;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>

<filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>

reading=document.getElementById('reading'),book=document.getElementById('book'),prevb=document.getElementById('prev'),nextb=document.getElementById('next'),t1,t2,cur=0;

var NOTE="A partir daqui, eu escrevi o que restava da minha história até aqui. Esta parte foi escrita com a finalidade do Siegfried ver. Não te julgo se não quiser continuar.";
var INTRO=["Se esta carta chegou às suas mãos, então quer dizer que eu estou morto.", "Muito obrigado por ter chegado até aqui comigo.", "Seja você quem for, alguém que me conheceu, alguém que apenas encontrou esta bolsa, alguém que nem sabe meu nome, você foi testemunha. E testemunha é tudo que alguém que viveu o que eu vivi pode pedir.", "Agora, se esta carta chegou até você, acredito que chegou por alguma razão. Poucas coisas na minha vida aconteceram sem uma. Eu só tenho um único pedido.", "Não é um pedido difícil. Não peço vingança, não peço que carregue meus fardos, não peço que continue minha luta como se ela fosse sua.", "Peço bondade.", "Eu imploro isso.", "Pratique bondade com as pessoas que merecem. O mundo que eu atravessei foi construído por pessoas que esqueceram o que é olhar um pro outro. Não se torne mais uma delas, por favor."],STORY=[["“O vinho a gente esquece. A mancha não vai embora.”", 0], ["Frequentemente escutava esta frase dentro de casa perguntei o que ela queria dizer de verdade. Na hora deixei pra lá, achei que não era algo assim tão sério. Mas eu não sabia de nada.", 0], ["Vivia numa pequena vila, um local tranquilo.", 0], ["A maioria dos moradores era como eu, Aggelus, descendentes de celestiais, filhos de diferentes raças, mas todos derivados dessa energia positiva que vem de dentro e de fora. Uma calma que emana sem intenção, que faz o ombro de um estranho relaxar sem que ele saiba por quê, que transforma a entrada de alguém num cômodo, praticamente um lugar feito pra atrair pessoas pela sua beleza e simplicidade.", 0], ["Meu pai tinha cabelos dourados, era forte como uma muralha. Minha mãe tinha olhos prateados, esbranquiçados, lindos, que trocavam de cor cada vez que eu olhava pra ela. Sempre penteava meu cabelo toda manhã, mesmo que eu já tinha idade suficiente pra fazer sozinho. Eu resmungava. Ela mesmo assim fazia do mesmo jeito.", 0], ["...queria ter tido mais tempo com ela...", 0], ["Peguei quase todas as características da minha mãe. Eu também não ficava pra trás, era bonito de um jeito que as pessoas não conseguiam ignorar. Sei disso não com orgulho, mas como um fato, da mesma forma que sei que o céu é azul. Entre os Aggelus já era claro. Sempre senti que pessoas me olhavam. Eu era um garoto, mas tinha extrema aparência feminina, os meninos me chamavam de fraco. Meu corpo nunca me favoreceu entre eles.", 0], ["Mas eu não era o que as pessoas diziam que eu era. Eu sabia que existia uma coisa dentro de mim que era completamente minha e que nenhuma opinião de fora conseguia tocar.", 0], ["Acreditava nisso sem dúvida.", 0], ["Ainda acredito.", 0], ["Mas sempre me trataram muito bem mesmo assim. Cresci achando que todo mundo era desse jeitinho, doce, perfeito. Descobri muito cedo que não.", 0], ["No mundo, aprendi, tudo roda sobre seus reis e seus subordinados. Sempre rodou. Minha vila existia porque até então nenhum rei tinha se lembrado de olhar pra ela.", 0], ["Até que um se lembrou.", 0], ["Absolutamente tudo mudou. O ataque começou no meio da noite.", 1], ["ninguém fala sobre isso mas um ataque a acontece na maior parte do tempo assim: você simplesmente não entende o que está acontecendo. O cérebro se recusa a acreditar. Você é bombardeado por informações, o barulho, o fogo, o cheiro de carvão e sangue. Pra aqueles que não têm poder, a única opção é simplesmente rezar e se esconder um simples desespero maldito de que se vc não for salvo a mais nada que vc possa fazer mesmo tentando...", 0], ["Os meus pais morreram, mas não vi como aconteceu. Só não os encontrei mais. Em nenhum lugar. Aquele dia eu vomitei tanto eu não conseguia acreditar que estava sozinho eu fiquei olhando cada corpo procurando qualquer feição parecida a minha família que restava mas não existia mais nada que eu pudesse fazer", 0], ["Os seguidores de Cusack, há fúria nos seus corações. Fúria real, genuína, sem planos, sem humanidade. Eles vieram porque queriam vir. Destruíram porque queriam destruir. A luta era o único objetivo.", 0], ["Quando o sol nasceu, o que sobrou da minha vila cabia numa sala pequena. Eu fui encontrado no meu desespero e me levaram pra fora da vila onde tinha uma carruagem velha.", 0], ["Nos reuniram. Amarraram os pulsos. E um dos homens de Cusack caminhou pela fila olhando os rostos.", 0], ["Nos outros ele passava rápido.", 0], ["Em mim ele parou.", 0], ["Ficou me olhando. Avaliando. E eu olhei de volta com a mesma expressão que usaria pra olhar uma parede, não desafio, não medo, simplesmente presença.", 0], ["Ele disse algo baixo pro homem ao lado. Os dois sorriram.", 0], ["Fomos levados, o que parecia anos-luz da nossa vila. Perdemos tudo: nossas casas, nossa vida, nossa humanidade.", 1], ["O leilão aconteceu em uma casa extremamente luxuosa, completamente diferente de tudo que vi na vida. Pessoas bem vestidas fazendo coisas que preferiam não chamar pelo nome.", 0], ["Isso me incomodou mais do que a crueldade dos que atacaram minha vila. Pelo menos os guerreiros de Cusack eram honestos sobre o que eram. Esses aqui tinham aprendido a sorrir enquanto faziam a mesma coisa. Sabiam usar palavras que soavam como civilização por cima de algo que não era.", 0], ["Os hipócritas justificam o próprio senso de justiça. Eu tinha 14 anos e já sabia identificar esse tipo de imundície. O mundo está cheio deles, gente que participa do sistema, se beneficia do sistema, e ainda assim encontra uma forma de se convencer de que está do lado certo.", 0], ["Fui o último a ser apresentado.", 1], ["Percebi pelos sussurros antes mesmo de entrar.", 0], ["Quando me colocaram na frente da sala, encontrei uma rachadura no meio daquele lugar chique, bonito. Era pequena, no reboco da parede do fundo, formato irregular, mais larga do lado esquerdo. Não sei por que escolhi ela. Só escolhi. Fiz um acordo comigo mesmo: enquanto eu conseguir ver aquela rachadura, ainda sou eu. Eles podem fazer o leilão. Podem dar lances. Podem decidir um valor. Nenhuma dessas coisas é sobre mim de verdade. É sobre o que acham que estão comprando.", 0], ["E o que achavam que estavam comprando não era eu.", 0], ["Os que me compraram ficaram no fundo da sala durante quase todo o leilão.", 0], ["Quietos. Com a paciência pesada de quem tem certeza de que vai conseguir o que quer. Esse tipo de certeza é diferente de arrogância. É mais fundo. Mais frio.", 0], ["Infelizmente eram mais seguidores de Cusack, mas não o tipo que ataca vilas. O tipo que tem um propósito muito maior do que só soldados.", 0], ["Quando o valor foi anunciado, um homem gigante olhou pra mim pela primeira vez. Tinha cicatrizes que claramente nunca foram tratadas de propósito.", 0], ["Não me olhou com desejo. Não com crueldade.", 0], ["Com propósito.", 0], ["Como alguém que finalmente encontrou a última peça de algo que vem construindo há tempo. E esse olhar era mais aterrorizante do que qualquer outra coisa que eu tinha visto, significava que eu não era um acidente no plano deles. Era um objetivo.", 0], ["Mesmo assim voltei a olhar de volta pra rachadura na parede.", 0], ["Ainda estava lá.", 0], ["A partir de hoje ate os dias da minha morte sempre, essa rachadura sou eu.", 0], ["Tantos recursos me mantiveram vivo naquela noite. Tanta coisa trabalhando pra me fazer sobreviver sem que eu pedisse. O corpo que continuou funcionando enquanto eu estava distante dele. As pernas que me carregaram quando a cabeça não estava completamente no controle.", 0], ["Às vezes eu queria só dissolver. Transformar os pensamentos em pasta, devolver as células pra lama, descansar de ser eu mesmo por um instante. Esse desejo existia, limpo, honesto.", 0], ["Mas existia junto com outra coisa.", 0], ["Na hora lembrei da voz da minha mãe.", 0], ["O vinho a gente esquece. A mancha não vai embora.", 0], ["A mancha é deles. O que aconteceu com minha vila, o leilão, os olhos do homem com as cicatrizes, tudo isso é a mancha deles no mundo. Não minha.", 0], ["Eu não sou o vinho derramado.", 0], ["Eu sou o que sobrou depois que tentaram acabar com tudo, e descobriram que tem uma coisa dentro de mim que não sabe como ser derramada.", 0], ["Ainda não sei o que eles querem de mim.", 0], ["Mas sei quem eu sou enquanto descubro.", 0], ["E enquanto eu souber isso, eles não terminaram nada.", 0], ["Foi transportado até o inferno onde vivi até os meus 54, foi fadado a viver diversos anos sem parar naquela cidade onde eu era completamente deles. A cidade era fundada em homenagem a Cusack, onde viviam seus seguidores e toda escória que encontra conforto quando a crueldade é a lei e não há exceção. Ruas que cheiravam a tudo menos ar. Pessoas que andavam com o orgulho específico de quem sabe que pode fazer o que quiser e não vai responder por isso.", 1], ["Eu desprezava cada centímetro daquele lugar.", 0], ["O homem que me comprou era um dos mais ricos da cidade. Fui forçado a trabalhar nos primeiros anos como um escravo completo, eu limpava e fazia comida para sua mansão imunda. Depois de poucos anos eles começaram a me maltratar e cada vez mais a situação ficava pior.", 0], ["Me recuso a escrever qualquer coisa que aconteceu. Não é que eu não me lembro de nada, pelo contrário, lembro de tudo escrito com vermelho, cravado no meu cérebro, grudado, impossível de esquecer. Se eu apenas pensar nelas, essas palavras vão ganhar o mesmo peso que passei anos aprendendo a não me esmagar. Me recuso a deixar isso acontecer agora, não é a hora, ou essa será minha última carta. Já me desculpe, mas já me abri demais. O que eu posso dizer é o seguinte: meu corpo, que nunca foi forte, foi ficando mais fraco a cada mês. Cada semana. Cada ano. Às vezes parecia que o que restava de mim era só pele sobre osso e teimosia.", 0], ["Mas eu era a rachadura.", 0], ["Pequena. Irregular. Mais larga do lado esquerdo. E completamente impossível de apagar.", 0], ["Persisti. Não de um jeito heroico com discurso e punho erguido. Persisti do jeito silencioso e sem graça que é o único jeito real de persistir: acordando. Respirando. Recusando a deixar que o que faziam com o meu corpo chegasse até a coisa dentro de mim que era minha.", 0], ["Às vezes eu queria dissolver. Esse desejo voltava sempre, limpo e honesto como sempre foi. Transformar os pensamentos em pasta, devolver as células pra lama, descansar de ser eu mesmo por um instante.", 0], ["Mas existia outra coisa junto com esse desejo.", 0], ["Sempre existia. Eu sou a exceção, eu sempre serei a exceção.", 0], ["Eu só queria viver e eu tinha pelo menos o dinheiro do meu lado, por eu ser posse de um velho caquético maldito, eles não poderiam só me matar e me tacar no lago. Então eu fiquei quieto por todos esses rápidos e longos anos.", 0], ["Um ano eu estava à completa beira do desespero, não da morte, nem longe disso. Eu me recusei a fazer uma coisa e me trancaram num calabouço por um tempo. Estava extremamente cansado de lutar, eu conseguia ver a minha humanidade finalmente saindo do meu corpo, estava à beira de um colapso mental. Uma menina apareceu do nada no lado de fora do calabouço. Eu conseguia ver pela sua aparência que ela tinha quase minha idade de quando tudo começou. Ela era uma sulfure extremamente diferente do que eu já vi em todo o lugar. O rosto dela, assustada com meu estado, foi tão encantador. Nunca ninguém naquela cidade se preocupou comigo daquele jeito. A voz dela era fina, reconfortante. Ela me ofereceu uma maçã que era impossível eu recusar. Eu conversei com ela o dia inteiro de fora da grade. Ela nunca gostou daquele lugar, pelo contrário, odiava todos, exatamente que nem eu. Depois de alguns dias eu fui liberto das catacumbas, mas por algum motivo eu consegui manter contato com ela por muitos anos. Ela jurava por tudo que ia arranjar um jeito de me tirar dali. E eu jurei de volta que daria minha vida pra proteger ela no processo.", 0], ["Eu não sabia o que fazer com bondade naquele lugar. Faz tempo que não recebia nenhuma sem que custasse algo. Mas ela curou alguma coisa em mim que eu não sabia que precisava ser curada. Me fez lembrar, concretamente, que existia ainda pessoas boas no mundo, pessoas que são necessárias, que precisam de carinho e admiração.", 0], ["Eu sou grato a ela do fundo do meu coração. Me desculpe, fia.", 0], ["Fia foi morta na minha frente. Nós ficamos anos juntos e tudo foi quebrado. Ela morreu crucificada por me ajudar.", 0], ["O filho da puta daquele gigante me buscou na mesma hora, puto por aquilo. Ele não me deu nem um segundo pra eu respirar. Me levou numa sala que eu nunca tinha entrado. As correntes eram de um material que eu não conseguia identificar, extremamente duro, frio de um jeito que não era só temperatura. Quatro delas. Do ombro até o pulso, colocadas de qualquer jeito, sem cuidado, como se a dor fosse parte do processo. Isso era tudo parte de um plano. Diversas pessoas se reuniram e criaram no chão uma espiral muito esquisita, completamente anormal, impossível de explicar. O ar ficou extremamente denso. Eu percebi: eu era a isca. Eu era o que, desde o começo, eles queriam. Uma peça bem feita, concluída com dor e sofrimento.", 0], ["Não pensei duas vezes. Fechei os olhos. Não tinha mais nada que eu podia fazer.", 0], ["Rezei do fundo do meu coração.", 0], ["Rezei pra Valkaria.", 0], ["A Quebradora de Correntes.", 0], ["E ela me ouviu.", 0], ["Não sei descrever o que aconteceu dentro de mim naquele momento.", 0], ["Só sei que o corpo, que estava mais fraco do que nunca, foi preenchido por algo. Não de fora pra dentro. De dentro pra fora. Como se algo que sempre esteve ali, dormindo, tivesse finalmente recebido permissão pra acordar.", 0], ["Abri os olhos e recebi o melhor presente que alguém podia dar pra qualquer um: a liberdade. Nas minhas mãos havia uma arma com poderes inimagináveis que parecia ter sido feita pra mim especificamente, não porque eu merecia, mas porque ela sabia o que eu precisava.", 0], ["Passei anos sendo corroído. Era hora de entender o que isso significa quando você escolhe fazer isso de propósito.", 0], ["Junto a tudo isso fui abençoado de um jeito duplo. Um guerreiro incrível tinha chegado pra além de me salvar, acabar com todos esses arrombados. Obrigado, Siegfried.", 0], ["Eu usei meu poder máximo. Que até então eu não sabia que tinha.", 0], ["Com a minha ajuda, o que seria uma batalha difícil foi facilitada em fração de segundos. Nós matamos cada um, um por um.", 0], ["E quem sobrou foi o filho da puta do gigante que fugiu sendo teletransportado. Por algum motivo ele não lutou. Ele ficou parado com raiva, mas não tinha pressa. Ele tinha todos os tipos de maneiras de parecer cruel, não importa a situação.", 0], ["Valkaria me escolheu naquele quarto, entre correntes e rezas e o cheiro de merda.", 0], ["Não me escolheu porque eu era forte. Meu corpo mal conseguia se levantar.", 0], ["Ela escolheu porque eu era a rachadura.", 0], ["Pequena. Irregular. Mais larga do lado esquerdo.", 0], ["E completamente impossível de apagar, por mais que tentassem.", 0], ["Ass: <span class=nm>Nyame Nti</span>", 2]];

  book.style.opacity='1';
  book.style.transform='none';
  env.classList.add('gone');
}
function closeIt(){
  clearTimeout(t1);clearTimeout(t2);
  book.style.transition='none';book.style.opacity='0';
  reading.classList.remove('show');
  cur=0;render(true);
  env.classList.remove('gone');
  t2=setTimeout(function(){env.classList.remove('open');sheet.style.opacity='1';hint.classList.remove('hide');envflipb.style.opacity='1';envflipb.style.pointerEvents='auto'},1700);
}
function setEnvFlip(f){envflip.classList.toggle('flipped',f);envflipb.textContent=f?'Ver a frente':'Virar o envelope'}
envflipb.addEventListener('click',function(){setEnvFlip(!envflip.classList.contains('flipped'))});
env.addEventListener('click',openIt);
env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt()}});
nextb.addEventListener('click',function(){go(1)});
prevb.addEventListener('click',function(){go(-1)});
document.getElementById('again').addEventListener('click',closeIt);
document.addEventListener('keydown',function(e){if(!reading.classList.contains('show'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script>
</body>
</html>
